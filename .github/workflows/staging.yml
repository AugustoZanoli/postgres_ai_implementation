name: Enforce staging source
on:
  pull_request:
    branches: [staging]

jobs:
  check-source:
    runs-on: ubuntu-latest
    steps:
      - name: Only development can merge into staging
        run: |
          if [ "${{ github.head_ref }}" != "development" ]; then
            echo "PRs para staging só podem vir de development."
            exit 1
          fi